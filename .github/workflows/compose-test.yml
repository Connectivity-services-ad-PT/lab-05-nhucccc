name: Lab05 Docker Compose and Newman Verification

on:
  push:
  pull_request:

jobs:
  compose-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Lint OpenAPI contract
        run: npm run lint:openapi

      - name: Start Docker Compose stack
        run: docker compose up -d --build

      - name: Wait for all services to be healthy
        run: |
          echo "Waiting for API (port 8000)..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "API is ready"
              break
            fi
            sleep 3
          done

          echo "Waiting for AI service (port 9000)..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/health > /dev/null 2>&1; then
              echo "AI service is ready"
              break
            fi
            sleep 3
          done

          echo "Checking DB readiness..."
          for i in $(seq 1 20); do
            if docker exec fit4110-db-lab05 pg_isready -U lab05 > /dev/null 2>&1; then
              echo "DB is ready"
              break
            fi
            sleep 3
          done

      - name: Show service health
        run: |
          echo "=== API health ==="
          curl -s http://localhost:8000/health
          echo ""
          echo "=== AI health ==="
          curl -s http://localhost:9000/health
          echo ""
          echo "=== DB readiness ==="
          docker exec fit4110-db-lab05 pg_isready -U lab05

      - name: Run Newman against Compose stack
        run: npm run test:compose

      - name: Show compose logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop Compose stack
        if: always()
        run: docker compose down -v

      - name: Upload Newman reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab05-newman-reports
          path: reports/
